name: Update profile statistics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-stats.yml
      - scripts/activate-profile-stats.mjs
      - scripts/generate-streak.mjs

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check private statistics token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.ALVEERIA }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "::error::Add the ALVEERIA Actions secret with access to the repositories you want counted. Existing public cards will be kept."
            exit 1
          fi

      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate all-time statistics
        uses: readme-tools/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: stats
          options: username=alveeria&include_all_commits=true&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=F75C7E&icon_color=F8D847&text_color=A9FEF7
          path: assets/github-stats.svg
          token: ${{ secrets.ALVEERIA }}

      - name: Generate aggregate language statistics
        uses: readme-tools/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: top-langs
          options: username=alveeria&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&title_color=F75C7E&text_color=A9FEF7
          path: assets/github-languages.svg
          token: ${{ secrets.ALVEERIA }}

      - name: Test generators
        run: node --test scripts/*.test.mjs

      - name: Generate contribution streak
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.ALVEERIA }}
        run: node scripts/generate-streak.mjs

      - name: Validate cards and update README references
        run: node scripts/activate-profile-stats.mjs

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg assets/github-streak.svg README.md
          if git diff --cached --quiet; then
            echo "Statistics are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile statistics"
          git push
